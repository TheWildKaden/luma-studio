<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141615">
  <title>Luma Studio — Yakuza 0 Mod Maker</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true">L</span><span>Luma Studio</span></div>
    <span class="edition">YAKUZA 0 / CFC EDITOR</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="title">
      <div>
        <h1 id="title">Fighter command editor<span>.</span></h1>
        <p>Remap moveset animations and generate a replacement CFC for Yakuza 0.</p>
      </div>
      <button type="button" id="export" class="primary" disabled>Download .cfc <span aria-hidden="true">↓</span></button>
    </section>

    <section id="drop-zone" class="file-panel" aria-label="Base CFC file">
      <div class="file-icon" aria-hidden="true">.CFC</div>
      <div class="file-detail">
        <strong id="filename">Open a fighter command file</strong>
        <span id="file-info">Drop fighter_command_main.cfc here or browse.</span>
      </div>
      <button id="browse" class="secondary" type="button">Browse files</button>
      <input id="file" type="file" accept=".cfc" hidden>
    </section>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="workspace" class="workspace">
      <aside class="panel">
        <div class="panel-heading">
          <h2>Movesets <span id="group-count" class="count"></span></h2>
          <label class="search-label" for="group-search">Filter movesets</label>
          <input type="search" id="group-search" placeholder="Kiryu, Majima, or an ID" disabled>
        </div>
        <div id="groups" class="groups" aria-label="Movesets"></div>
      </aside>

      <section class="panel commands" aria-labelledby="moveset-title">
        <div class="panel-heading command-heading">
          <div>
            <h2 id="moveset-title">Commands</h2>
            <p id="moveset-path"></p>
          </div>
          <div class="command-filter">
            <label class="search-label" for="move-search">Filter commands</label>
            <input type="search" id="move-search" placeholder="Name or animation" disabled>
          </div>
        </div>
        <div id="command-content"></div>
      </section>
    </section>
  </main>

  <dialog id="remap" aria-labelledby="dialog-title">
    <form method="dialog" id="remap-form">
      <h2 id="dialog-title">Replace animation</h2>
      <p id="remap-command"></p>
      <label for="animation-search">Filter animation IDs</label>
      <input id="animation-search" type="search" autocomplete="off" placeholder="Search animations in this file">
      <label for="animation">Replacement animation</label>
      <select id="animation" size="8" required></select>
      <div class="dialog-actions">
        <button type="button" id="cancel" class="secondary">Cancel</button>
        <button type="submit" id="apply" class="primary">Apply change</button>
      </div>
    </form>
  </dialog>
</body>
</html>
